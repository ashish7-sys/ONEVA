# ==============================================================================
# ONEVA - Privacy-First Android Enhancement & Customization Platform
# Codemagic CI/CD Automation Workflow for Android Release Builds
# Package ID: io.oneva.android.launcher
# Architecture: High-Performance Android Native Shell + Web Asset Bundle
# ==============================================================================

workflows:
  oneva-android-release:
    name: ONEVA Android Release APK
    max_build_duration: 35
    instance_type: mac_mini_m2

    environment:
      java: 17
      node: 20
      groups:
        - oneva_release_keystore
      vars:
        PACKAGE_NAME: "io.oneva.android.launcher"
        ONEVA_VERSION_NAME: "1.0.0"
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $CM_BUILD_DIR/node_modules

    scripts:
      - name: Verify Build Environment & Versions
        script: |
          echo "=========================================================="
          echo "ONEVA ANDROID CI/CD RELEASE PIPELINE"
          echo "=========================================================="
          echo "Node.js:  $(node -v)"
          echo "NPM:      $(npm -v)"
          echo "Java:     $(java -version 2>&1 | head -n 1)"
          echo "Android:  API Level 34 (Target SDK)"
          echo "Package:  $PACKAGE_NAME"
          echo "Version:  $ONEVA_VERSION_NAME (Build #$BUILD_NUMBER)"
          echo "Workdir:  $PWD"
          echo "=========================================================="

      - name: Install Node.js Dependencies
        script: |
          echo "Installing project dependencies..."
          npm ci || npm install --legacy-peer-deps

      - name: Build Web Application Bundle (Vite Production)
        script: |
          echo "Compiling Vite web assets..."
          npx vite build
          echo "Web build verified in dist/ directory:"
          ls -lh dist/

      - name: Sync Web Production Assets into Android Shell
        script: |
          echo "Preparing Android assets folder..."
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/*
          cp -r dist/* android/app/src/main/assets/
          echo "Assets successfully synced into android/app/src/main/assets:"
          ls -la android/app/src/main/assets/

      - name: Configure Cryptographic Release Signing Keystore
        script: |
          set -e
          echo "Checking for production release keystore credentials..."
          # The keystore is permanently maintained to allow future OTA/APK updates.
          # Supports both Base64-encoded environment secret (CM_KEYSTORE) and file path (CM_KEYSTORE_PATH).
          if [ -n "$CM_KEYSTORE" ]; then
            echo "Decoding permanent release keystore from CM_KEYSTORE environment variable..."
            echo "$CM_KEYSTORE" | base64 --decode > /tmp/oneva_release_keystore.keystore
            export CM_KEYSTORE_PATH="/tmp/oneva_release_keystore.keystore"
            if [ -n "$CM_ENV" ]; then
              echo "CM_KEYSTORE_PATH=/tmp/oneva_release_keystore.keystore" >> "$CM_ENV"
            fi
            echo "Keystore successfully prepared at: /tmp/oneva_release_keystore.keystore"
          elif [ -n "$CM_KEYSTORE_PATH" ] && [ -f "$CM_KEYSTORE_PATH" ]; then
            echo "Using existing keystore file detected at: $CM_KEYSTORE_PATH"
            if [ -n "$CM_ENV" ]; then
              echo "CM_KEYSTORE_PATH=$CM_KEYSTORE_PATH" >> "$CM_ENV"
            fi
          else
            echo "================================================================================"
            echo "NOTICE: No production keystore secret configured in Codemagic environment."
            echo "The build will proceed using standard debug signing fallback so the APK is created."
            echo "To use official release signing, define CM_KEYSTORE in Codemagic variable groups."
            echo "================================================================================"
          fi

      - name: Build Android Release APK & App Bundle
        script: |
          set -e
          echo "Entering Android native project directory..."
          cd android

          # Ensure Gradle wrapper jar exists
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper jar missing; downloading official v8.4.0 wrapper..."
            mkdir -p gradle/wrapper
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          fi

          chmod +x gradlew

          # Guarantee keystore path availability for Gradle
          if [ -z "$CM_KEYSTORE_PATH" ] && [ -f /tmp/oneva_release_keystore.keystore ]; then
            export CM_KEYSTORE_PATH="/tmp/oneva_release_keystore.keystore"
          fi

          if [ -n "$CM_KEYSTORE_PATH" ] && [ -f "$CM_KEYSTORE_PATH" ]; then
            echo "Configured Release Keystore: $CM_KEYSTORE_PATH"
          fi

          echo "=========================================================="
          echo "Building Signed Release APK (assembleRelease)..."
          echo "=========================================================="
          ./gradlew assembleRelease --stacktrace

          echo "=========================================================="
          echo "Building Signed Release AAB (bundleRelease)..."
          echo "=========================================================="
          ./gradlew bundleRelease --stacktrace

      - name: Verify Release Artifact Integrity & Availability
        script: |
          set -e
          echo "=========================================================="
          echo "VERIFYING GENERATED RELEASE ARTIFACTS"
          echo "=========================================================="

          echo "Searching for generated APK files..."
          APK_FOUND=$(find android/app/build/outputs -type f -name "*.apk" 2>/dev/null || true)
          echo "APK search results:"
          echo "$APK_FOUND"

          echo "Searching for generated AAB files..."
          AAB_FOUND=$(find android/app/build/outputs -type f -name "*.aab" 2>/dev/null || true)
          echo "AAB search results:"
          echo "$AAB_FOUND"

          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          RELEASE_AAB="android/app/build/outputs/bundle/release/app-release.aab"

          MISSING_COUNT=0

          if [ -f "$RELEASE_APK" ]; then
            APK_SIZE=$(ls -lh "$RELEASE_APK" | awk '{print $5}')
            echo "✓ Confirmed Release APK exists: $RELEASE_APK (Size: $APK_SIZE)"
          else
            echo "✗ ERROR: Expected Release APK NOT found at: $RELEASE_APK"
            MISSING_COUNT=$((MISSING_COUNT + 1))
          fi

          if [ -f "$RELEASE_AAB" ]; then
            AAB_SIZE=$(ls -lh "$RELEASE_AAB" | awk '{print $5}')
            echo "✓ Confirmed Release AAB exists: $RELEASE_AAB (Size: $AAB_SIZE)"
          else
            echo "✗ ERROR: Expected Release AAB NOT found at: $RELEASE_AAB"
            MISSING_COUNT=$((MISSING_COUNT + 1))
          fi

          if [ $MISSING_COUNT -gt 0 ]; then
            echo "=========================================================="
            echo "FATAL: Artifact verification failed! $MISSING_COUNT release artifact(s) missing."
            echo "=========================================================="
            exit 1
          fi

          echo "=========================================================="
          echo "ALL ARTIFACTS VERIFIED SUCCESSFULLY"
          echo "Release APK and AAB are ready for download."
          echo "=========================================================="

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt
      - "**/build/outputs/**/*.apk"
      - "**/build/outputs/**/*.aab"

    publishing:
      email:
        recipients:
          - ashishkumar29032011@gmail.com
        notify:
          success: true
          failure: true
